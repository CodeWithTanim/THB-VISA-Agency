<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Setup | THB VISA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #024caa 0%, #012b61 100%);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .social-popup {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 3rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInScale 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: var(--accent-color);
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        h2 {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .btn-back {
            display: inline-block;
            padding: 12px 32px;
            background: white;
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(255, 255, 255, 0.2);
            background: var(--accent-color);
        }

        .social-icons-preview {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .social-icons-preview i {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="social-popup">
        <div class="icon-box">
            <i class="fas fa-share-nodes"></i>
        </div>
        <div class="social-icons-preview">
            <i class="fab fa-facebook"></i>
            <i class="fab fa-twitter"></i>
            <i class="fab fa-instagram"></i>
            <i class="fab fa-linkedin"></i>
        </div>
        <h2>Social Media Setup Required</h2>
        <p>You need to provide the social media account information(profile url, page url, etc) so that we can complete the configuration for your official pages.</p>
        <a href="javascript:history.back()" class="btn-back">Go Back</a>
    </div>
</body>
</html>
